version: 2

sources:
  - name: ecommerce
    description: "Raw ecommerce data for ShopStream loaded from S3 via Snowflake COPY INTO"
    database: SHOPSTREAM_RAW
    schema: ECOMMERCE
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    loaded_at_field: created_at

    tables:
      - name: raw_customers
        description: "Raw customer records from the ecommerce application database"
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: customer_id
            description: "Unique identifier for each customer"
          - name: first_name
            description: "Customer first name"
          - name: last_name
            description: "Customer last name"
          - name: email
            description: "Customer email address"
          - name: phone
            description: "Customer phone number"
          - name: segment
            description: "Customer segment - PREMIUM, STANDARD, or BRONZE"
          - name: region
            description: "Geographic region of the customer"
          - name: country
            description: "Country of the customer"
          - name: created_at
            description: "Timestamp when the customer record was created"
          - name: updated_at
            description: "Timestamp when the customer record was last updated"


      - name: raw_orders
        description: "Raw order header records"
        columns:
          - name: order_id
            description: "Unique identifier for each order"
          - name: customer_id
            description: "Foreign key to raw_customers"
          - name: store_id
            description: "Foreign key to raw_stores"
          - name: order_date
            description: "Date the order was placed"
          - name: order_status
            description: "Current status - DELIVERED, CANCELLED, RETURNED, PROCESSING, SHIPPED"
          - name: order_channel
            description: "How the order was placed - ONLINE or IN_STORE"
          - name: total_amount
            description: "Total order amount before discounts"
          - name: discount_amount
            description: "Total discount applied to the order"
          - name: shipping_amount
            description: "Shipping fee charged"
          - name: created_at
            description: "Timestamp when order was created"
          - name: updated_at
            description: "Timestamp when order was last updated"

      - name: raw_order_items
        description: "Raw line items for each order"
        columns:
          - name: order_item_id
            description: "Unique identifier for each order line item"
          - name: order_id
            description: "Foreign key to raw_orders"
          - name: product_id
            description: "Foreign key to raw_products"
          - name: quantity
            description: "Number of units ordered"
          - name: unit_price
            description: "Price per unit at time of order"
          - name: discount_amount
            description: "Discount applied to this line item"
          - name: total_amount
            description: "Total amount for this line item after discount"
          - name: created_at
            description: "Timestamp when line item was created"

      - name: raw_products
        description: "Raw product catalog records"
        columns:
          - name: product_id
            description: "Unique identifier for each product"
          - name: product_name
            description: "Display name of the product"
          - name: category
            description: "Top level product category"
          - name: subcategory
            description: "Product subcategory"
          - name: supplier_id
            description: "Foreign key to raw_suppliers"
          - name: cost_price
            description: "Cost price paid to supplier"
          - name: selling_price
            description: "Retail selling price"
          - name: weight_kg
            description: "Product weight in kilograms"
          - name: is_active
            description: "Whether the product is currently active"
          - name: created_at
            description: "Timestamp when product was created"

      - name: raw_suppliers
        description: "Raw supplier records"
        columns:
          - name: supplier_id
            description: "Unique identifier for each supplier"
          - name: supplier_name
            description: "Name of the supplier company"
          - name: contact_email
            description: "Primary contact email for the supplier"
          - name: country
            description: "Country where supplier is based"
          - name: city
            description: "City where supplier is based"
          - name: lead_time_days
            description: "Average number of days from order to delivery"
          - name: rating
            description: "Internal supplier rating out of 5"
          - name: is_active
            description: "Whether the supplier is currently active"
          - name: created_at
            description: "Timestamp when supplier record was created"

      - name: raw_payments
        description: "Raw payment transaction records"
        columns:
          - name: payment_id
            description: "Unique identifier for each payment"
          - name: order_id
            description: "Foreign key to raw_orders"
          - name: payment_method
            description: "Payment method used - CREDIT_CARD, UPI, DEBIT_CARD, CASH, NET_BANKING"
          - name: payment_status
            description: "Status of payment - SUCCESS, REFUNDED, PENDING"
          - name: amount
            description: "Payment amount in INR"
          - name: currency
            description: "Currency code"
          - name: transaction_id
            description: "External payment gateway transaction reference"
          - name: payment_date
            description: "Timestamp when payment was processed"
          - name: created_at
            description: "Timestamp when payment record was created"

      - name: raw_shipments
        description: "Raw shipment and delivery tracking records"
        columns:
          - name: shipment_id
            description: "Unique identifier for each shipment"
          - name: order_id
            description: "Foreign key to raw_orders"
          - name: carrier
            description: "Shipping carrier name"
          - name: tracking_number
            description: "Carrier tracking reference number"
          - name: shipment_status
            description: "Current shipment status - DELIVERED, IN_TRANSIT, RETURNED"
          - name: shipped_date
            description: "Date the shipment was dispatched"
          - name: estimated_delivery
            description: "Expected delivery date"
          - name: actual_delivery
            description: "Actual delivery date - NULL if not yet delivered"
          - name: created_at
            description: "Timestamp when shipment record was created"

      - name: raw_reviews
        description: "Raw customer product review records"
        columns:
          - name: review_id
            description: "Unique identifier for each review"
          - name: order_id
            description: "Foreign key to raw_orders"
          - name: product_id
            description: "Foreign key to raw_products"
          - name: customer_id
            description: "Foreign key to raw_customers"
          - name: rating
            description: "Star rating from 1 to 5"
          - name: review_title
            description: "Short title of the review"
          - name: review_text
            description: "Full review text"
          - name: is_verified
            description: "Whether the review is from a verified purchase"
          - name: created_at
            description: "Timestamp when review was submitted"

      - name: raw_inventory
        description: "Raw inventory snapshot records by product and store"
        columns:
          - name: inventory_id
            description: "Unique identifier for each inventory record"
          - name: product_id
            description: "Foreign key to raw_products"
          - name: store_id
            description: "Foreign key to raw_stores"
          - name: quantity_available
            description: "Current available stock quantity"
          - name: quantity_reserved
            description: "Quantity reserved for pending orders"
          - name: reorder_level
            description: "Quantity threshold that triggers reorder"
          - name: last_restocked_date
            description: "Date of most recent stock replenishment"
          - name: snapshot_date
            description: "Date this inventory snapshot was taken"

      - name: raw_stores
        description: "Raw store location records"
        columns:
          - name: store_id
            description: "Unique identifier for each store"
          - name: store_name
            description: "Full name of the store"
          - name: store_type
            description: "Store format - Flagship, Standard, or Express"
          - name: city
            description: "City where store is located"
          - name: region
            description: "Geographic region"
          - name: state
            description: "State where store is located"
          - name: pincode
            description: "Postal code of store location"
          - name: opened_date
            description: "Date the store opened"
          - name: manager_id
            description: "Foreign key to raw_employees for store manager"
          - name: is_active
            description: "Whether the store is currently operating"

      - name: raw_employees
        description: "Raw employee records"
        columns:
          - name: employee_id
            description: "Unique identifier for each employee"
          - name: first_name
            description: "Employee first name"
          - name: last_name
            description: "Employee last name"
          - name: email
            description: "Employee work email address"
          - name: role
            description: "Job role or title"
          - name: store_id
            description: "Foreign key to raw_stores"
          - name: salary
            description: "Monthly salary in INR"
          - name: hire_date
            description: "Date the employee was hired"
          - name: is_active
            description: "Whether the employee is currently active"

      - name: raw_returns
        description: "Raw order return and refund records"
        columns:
          - name: return_id
            description: "Unique identifier for each return"
          - name: order_id
            description: "Foreign key to raw_orders"
          - name: product_id
            description: "Foreign key to raw_products"
          - name: customer_id
            description: "Foreign key to raw_customers"
          - name: return_reason
            description: "Reason for return - DEFECTIVE, WRONG_ITEM, NOT_AS_DESCRIBED etc"
          - name: return_status
            description: "Current return status - COMPLETED, PENDING, REJECTED"
          - name: refund_amount
            description: "Amount refunded to customer in INR"
          - name: refund_method
            description: "Method used for refund"
          - name: return_date
            description: "Date the return was initiated"
          - name: created_at
            description: "Timestamp when return record was created"
